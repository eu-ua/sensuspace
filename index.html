<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensu Space</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div id="app">
        
        <div id="auth-modal" class="auth-modal-overlay hidden">
            <div class="auth-container">
                <button id="close-auth-btn" class="close-modal-btn"><i class="bi bi-x-lg"></i></button>
                <div class="auth-header-brand">
                    <h2>Sensu</h2>
                    <p>Простір для творців</p>
                </div>
                <div class="auth-tabs">
                    <button class="auth-tab-btn active" id="tab-login">Вхід</button>
                    <button class="auth-tab-btn" id="tab-register">Реєстрація</button>
                </div>
                <form id="auth-form" class="auth-form">
                    <div class="input-group">
                        <i class="bi bi-person input-icon-left"></i>
                        <input type="text" id="auth-username" placeholder="Твій логін (без пробілів)" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <i class="bi bi-lock input-icon-left"></i>
                        <input type="password" id="auth-password" placeholder="Пароль (мінімум 6 символів)" required>
                        <i class="bi bi-eye input-icon-right" id="toggle-password-btn"></i>
                    </div>
                    <div id="auth-error-message" class="auth-error hidden"></div>
                    <button type="submit" class="auth-submit-btn" id="auth-submit-btn">Увійти</button>
                </form>
            </div>
        </div>

        <section id="screen-home" class="app-screen active">
            <div class="top-header">
                <h2>Sensu</h2>
                <div class="header-actions">
                    <button class="icon-btn create-post-trigger"><i class="bi bi-plus-square"></i></button>
                    <button id="open-filter-btn" class="icon-btn"><i class="bi bi-three-dots"></i></button>
                    <button id="open-search-btn" class="icon-btn"><i class="bi bi-search"></i></button>
                </div>
            </div>
            <div class="feed-toggle-wrapper">
                <div class="feed-toggle">
                    <button class="toggle-btn active">Рекомендації</button>
                    <button class="toggle-btn">Найпопулярніше</button>
                </div>
            </div>
            <div class="feed-container">
                </div>
        </section>

        <section id="screen-messages" class="app-screen">
            <div class="chat-header">
                <h2>Повідомлення</h2>
                <button class="icon-btn"><i class="bi bi-pencil-square"></i></button>
            </div>
            <div id="dynamic-chat-list" class="chat-list">
                </div>
        </section>

        <section id="screen-global" class="app-screen">
            <div class="global-header">
                <h2>Глобальна</h2>
                <button class="icon-btn"><i class="bi bi-bell"></i></button>
            </div>
            <div class="global-search-container">
                <i class="bi bi-search search-icon"></i>
                <input type="text" placeholder="Пошук людей..." class="global-search-input">
            </div>
            <div class="interests-scroll">
                <button class="interest-tag active">Всі</button>
                <button class="interest-tag">#дизайн</button>
                <button class="interest-tag">#код</button>
                <button class="interest-tag">#музика</button>
                <button class="interest-tag">#текст</button>
                <button class="interest-tag add-interest"><i class="bi bi-plus-lg"></i></button>
            </div>
            <div class="global-content-area">
                <p style="text-align: center; color: var(--text-secondary); margin-top: 20px;">Введіть ім'я для пошуку людей...</p>
            </div>
        </section>

        <section id="screen-profile" class="app-screen">
            <div class="profile-top-bar">
                <button class="icon-btn create-post-trigger"><i class="bi bi-plus-square"></i></button>
                <button class="icon-btn" id="open-settings-btn"><i class="bi bi-three-dots"></i></button>
            </div>
            <div class="profile-header">
                <div class="avatar-wrapper cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop" alt="My Avatar" class="profile-main-avatar">
                    <div class="edit-badge"><i class="bi bi-pencil-fill"></i></div>
                </div>
                <div class="profile-info">
                    <h3 class="profile-nickname cursor-pointer">Користувач <i class="bi bi-pencil edit-icon"></i></h3>
                    <div class="profile-stats">
                        <div class="stat-item cursor-pointer" id="my-followers-btn">
                            <span class="stat-number" id="my-followers-count">0</span>
                            <span class="stat-label">читачів</span>
                        </div>
                        <div class="stat-item cursor-pointer" id="my-following-btn">
                            <span class="stat-number" id="my-following-count">0</span>
                            <span class="stat-label">підписок</span>
                        </div>
                    </div>
                </div>
            </div>
            <p class="profile-bio cursor-pointer">
                Натисніть сюди, щоб додати опис профілю. <i class="bi bi-pencil edit-icon"></i>
            </p>
            <div class="profile-tabs">
                <button class="p-tab-btn active"><i class="bi bi-grid-3x3"></i> Публікації</button>
            </div>
            <div class="profile-grid">
                </div>
        </section>

        <section id="other-user-profile-modal" class="app-screen">
            <div class="profile-top-bar">
                <button id="close-other-profile-btn" class="icon-btn"><i class="bi bi-arrow-left"></i></button>
                <h3 style="flex: 1; margin: 0; text-align: left; padding-left: 10px;">Профіль</h3>
            </div>
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img id="other-profile-avatar" src="" class="profile-main-avatar" style="border: 1px solid var(--border-color);">
                </div>
                <div class="profile-info">
                    <h3 id="other-profile-nickname" class="profile-nickname">...</h3>
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-number" id="other-followers-count">0</span>
                            <span class="stat-label">читачів</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="other-following-count">0</span>
                            <span class="stat-label">підписок</span>
                        </div>
                    </div>
                </div>
            </div>
            <p id="other-profile-bio" class="profile-bio">...</p>
            <div style="display: flex; gap: 10px; padding: 0 20px; margin-bottom: 20px;">
                <button id="follow-user-btn" class="text-btn-accent" style="flex: 1; border-radius: 20px; padding: 10px;">Підписатися</button>
                <button id="message-user-btn" class="action-btn" style="flex: 1; border-radius: 20px; padding: 10px; background: var(--bg-secondary); border: none; color: var(--text-primary);">Написати</button>
            </div>
            <div class="profile-tabs">
                <button class="p-tab-btn active"><i class="bi bi-grid-3x3"></i> Публікації</button>
            </div>
            <div id="other-profile-grid" class="profile-grid">
                </div>
        </section>

        <section id="chat-room-modal" class="app-screen">
            <div class="chat-header" style="justify-content: flex-start; gap: 15px;">
                <button id="close-chat-room-btn" class="icon-btn"><i class="bi bi-arrow-left"></i></button>
                <img id="chat-room-avatar" src="" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover;">
                <h3 id="chat-room-name" style="margin: 0; font-size: 16px;">Ім'я</h3>
            </div>
            <div id="chat-messages-container" class="chat-messages-container" style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; height: 65vh;">
                </div>
            <div class="chat-room-input-area" style="padding: 10px 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; background: var(--bg-color);">
                <input type="text" id="chat-message-input" placeholder="Написати повідомлення..." autocomplete="off" style="flex: 1; border: none; background: var(--bg-secondary); border-radius: 20px; padding: 12px 15px; color: var(--text-primary); outline: none;">
                <button id="send-message-btn" class="icon-btn" style="color: var(--accent-color);"><i class="bi bi-send-fill"></i></button>
            </div>
        </section>


        <nav class="bottom-nav">
            <button class="nav-btn active" data-screen="screen-home"><i class="bi bi-house-door"></i></button>
            <button class="nav-btn" data-screen="screen-messages"><i class="bi bi-chat-square-text"></i></button>
            <button class="nav-btn" data-screen="screen-global"><i class="bi bi-globe"></i></button>
            <button class="nav-btn" data-screen="screen-profile"><i class="bi bi-person"></i></button>
        </nav>

        <div id="settings-modal" class="popup-modal hidden">
            <div class="popup-content">
                <h3 class="sheet-title">Налаштування</h3>
                <div class="settings-list">
                    <button class="setting-item" id="theme-toggle-btn">
                        <div class="setting-item-left"><i class="bi bi-moon-stars"></i><span>Темна тема</span></div>
                        <div class="toggle-switch active" id="theme-switch"></div>
                    </button>
                    <button class="setting-item text-danger">
                        <div class="setting-item-left"><i class="bi bi-box-arrow-right"></i><span>Вийти з акаунта</span></div>
                    </button>
                </div>
            </div>
        </div>

        <div id="create-post-modal" class="popup-modal hidden">
            <div class="popup-content">
                <div class="create-post-header">
                    <button id="close-create-post-btn" class="icon-btn text-gray"><i class="bi bi-x-lg"></i></button>
                    <h3 class="sheet-title">Новий запис</h3>
                    <button id="submit-post-btn" class="text-btn-accent">Опублікувати</button>
                </div>
                <div class="create-post-body">
                    <textarea id="post-text-input" placeholder="Що вас надихає зараз?" rows="5"></textarea>
                    <div id="media-preview-container" class="hidden">
                        <button id="remove-media-btn" class="remove-media-icon"><i class="bi bi-x-circle-fill"></i></button>
                        <img id="image-preview" class="hidden" src="" alt="Preview">
                        <video id="video-preview" class="hidden" controls></video>
                    </div>
                </div>
                <div class="create-post-toolbar">
                    <button class="attach-btn" id="attach-image-btn"><i class="bi bi-image"></i></button>
                    <button class="attach-btn" id="attach-video-btn"><i class="bi bi-camera-video"></i></button>
                    <input type="file" id="image-input" accept="image/*" hidden>
                    <input type="file" id="video-input" accept="video/*" hidden>
                </div>
            </div>
        </div>

        <div id="custom-modal" class="popup-modal hidden">
            <div class="popup-content" style="max-width: 320px; text-align: center; margin: auto; border-radius: 20px;">
                <h3 id="custom-modal-title" class="sheet-title" style="margin-bottom: 10px; justify-content: center;">Повідомлення</h3>
                <p id="custom-modal-message" style="color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;"></p>
                <input type="text" id="custom-modal-input" class="search-modal-input hidden" style="width: 100%; margin-bottom: 20px; text-align: center; background: var(--bg-color);">
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="custom-modal-cancel" class="action-btn hidden" style="flex: 1; padding: 10px; justify-content: center; background: var(--bg-color); border-radius: 12px;">Скасувати</button>
                    <button id="custom-modal-confirm" class="text-btn-accent" style="flex: 1; padding: 10px; justify-content: center; background: var(--accent-color); color: white; border-radius: 12px;">ОК</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
